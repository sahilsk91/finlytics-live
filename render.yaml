# Render one-click blueprint — deploys backend + static frontend
# Replace the repo URL after you push to GitHub.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: finlytics-backend
    runtime: docker
    dockerfilePath: ./finlytics-backend/Dockerfile
    dockerContext: ./finlytics-backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finlytics-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://finlytics-frontend.onrender.com
        # After frontend deploy, replace with your actual Vercel URL:
        # https://your-app.vercel.app
      - key: PORT
        value: 5000
    autoDeploy: false

  - type: web
    name: finlytics-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: finlytics-frontend
    envVars:
      - key: VITE_API_URL
        value: https://finlytics-backend.onrender.com/api
        # Replace after backend deploy — use the URL Render assigns to the backend above
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: false

databases:
  - name: finlytics-db
    plan: free
    databaseName: finlytics
    user: finlytics
